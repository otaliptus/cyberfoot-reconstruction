<!doctype html><meta charset="utf-8"><title>Original manager recap — development</title><style>body{margin:0;background:#3a6ea5;display:grid;place-items:center;min-height:100vh}canvas{width:1024px;max-width:100vw;height:auto}</style><canvas width="1024" height="768" tabindex="0" aria-label="Original manager changes"></canvas><script type="module">
import {ManagerNoticeWindow} from './manager-notice-window.mjs';import {createManagerDialogs} from './manager-dialogs.mjs';import {nativeResultsCareerEffects} from './results-native-effects.mjs';import {readSave,writeSave,record} from './save-format.mjs';import {OriginalRandom} from './match-core.mjs';
const [forms,language,bytes,crestAssets]=await Promise.all([fetch('forms.json').then(r=>r.json()),fetch('language.json').then(r=>r.json()),fetch('tests/original-career.s15').then(r=>r.arrayBuffer()),fetch('crest-assets.json').then(r=>r.json())]),save=readSave(bytes),v=b=>new DataView(b.buffer,b.byteOffset,b.byteLength),c=v(save.career),rng=new OriginalRandom(656410),runtime={nationalManagerCount:10},query=new URLSearchParams(location.search),renderer=await new ManagerNoticeWindow(document.querySelector('canvas'),forms).prepare(),dialogs=createManagerDialogs(renderer,{save,runtime,rng,language,crestAssets,manualClock:query.has('manualClock')}),{recap,dismissal}=dialogs,effects=nativeResultsCareerEffects(save,runtime,{rng,temporary:{lineups:[],matchTeams:[]},managerDialogs:dialogs});
c.setInt32(0x88,1,true);c.setUint8(0xd8,1);c.setUint8(0x6c8,query.has('fast')?1:0);
for(let id=0;id<c.getInt32(0x3c,true);id++){const club=v(record(save,'clubs',id)),failing=id<30&&club.getUint8(0x39)===0;club.setInt32(0x50,failing?0:100,true);if(failing)club.setInt32(0x1a8,20,true);}
if(query.has('mixed')){v(record(save,'clubs',11)).setInt32(0x50,0,true);v(record(save,'clubs',11)).setInt32(0x54,14,true);}
let finished=false,error=null;window.recapDevelopment={save:()=>writeSave(save),renderer,recap,dismissal,runtime};window.render_game_to_text=()=>JSON.stringify({developmentProof:true,completeGame:false,form:renderer.frame?.form??null,recap:recap.snapshot(),dismissal:dismissal.snapshot(),finished,error});window.advanceTime=async ms=>recap.advanceTime(ms);
window.recapFlow=effects.managerChanges().then(()=>{finished=true;}).catch(e=>{error=String(e);throw e;});
</script>
