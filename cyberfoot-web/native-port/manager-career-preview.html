<!doctype html><meta charset="utf-8"><title>Career manager offers — development</title><style>body{margin:0;background:#3a6ea5;display:grid;place-items:center;min-height:100vh}canvas{width:1024px;max-width:100vw;height:auto}</style><canvas width="1024" height="768" tabindex="0" aria-label="Career manager offer"></canvas><script type="module">
import {StandingsWindow} from './standings-window.mjs';import {createManagerCareerDialogs} from './manager-career-dialogs.mjs';import {nativeResultsCareerEffects} from './results-native-effects.mjs';import {readSave,writeSave,record} from './save-format.mjs';import {OriginalRandom} from './match-core.mjs';import {removeManager} from './manager-employment.mjs';
