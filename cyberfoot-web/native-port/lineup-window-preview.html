<!doctype html><meta charset="utf-8"><title>Original lineup window — development</title><style>body{margin:0;background:#3a6ea5;display:grid;place-items:center;min-height:100vh}canvas{width:1024px;max-width:100vw;height:auto}</style><canvas width="1024" height="768" aria-label="Original lineup window"></canvas><script type="module">
import {createResultsHost} from './results-host.mjs';

import {commitHumanLineup} from './human-lineup-commit.mjs';import {prepareDomesticTeams} from './prematch-teams.mjs';import {openDomesticMatchSession} from './domestic-match-session.mjs';import {OriginalRandom} from './match-core.mjs';

 }finally{starting=false;}
});

const ratingChecks=new URLSearchParams(location.search).get('check')==='ratings'?await(await import('./tests/player-rating-proof.mjs')).checkPlayerRatings():null;

const championChecks=new URLSearchParams(location.search).get('check')==='champion'?await(await import('./tests/champion-browser-proof.mjs')).checkChampionBrowser():null;
const nationalChecks=new URLSearchParams(location.search).get('check')==='national'?await(await import('./tests/national-knockout-proof.mjs')).checkNationalKnockout():null;
const nationalChampionChecks=new URLSearchParams(location.search).get('check')==='national-champion'?await(await import('./tests/national-champion-browser.mjs')).checkNationalChampionBrowser():null;
const batchChecks=new URLSearchParams(location.search).get('check')==='batch'?await(await import('./tests/competition-batch-browser.mjs')).checkCompetitionBatchBrowser():null;
const automaticChecks=new URLSearchParams(location.search).get('check')==='automatic'?await(await import('./tests/automatic-browser-proof.mjs')).checkAutomaticBrowser():null;
const preparationChecks=new URLSearchParams(location.search).get('check')==='preparation'?await(await import('./tests/match-preparation-browser.mjs')).checkMatchPreparationBrowser():null;
window.render_game_to_text=()=>JSON.stringify({developmentProof:true,completeGame:false,manualChecks,commitChecks,scoreChecks,resultChecks,ratingChecks,historyChecks,weeklyChecks,knockoutChecks,championChecks,nationalChecks,nationalChampionChecks,batchChecks,automaticChecks,preparationChecks,form:renderer.frame?.form,scope:'native lineup-to-league match integration; full career routing pending',starting,startMessage,resultsReady,results:resultsHost?.snapshot(),round:career.getInt32(0x4c,true),leg:career.getInt32(0x50,true),match:matchSession?.snapshot(),nextRoute,formation,checkedKit,selectedKit:state.clubs[clubId].selectedKit,kitPaths,club:state.clubs[clubId].name,roster:rows.map(r=>({playerId:r.playerId,name:state.players[r.playerId].name,status:r.status})),slots,tactics:{playStyle:state.clubs[clubId].playStyle,marking:state.clubs[clubId].marking,attackFocus:state.clubs[clubId].attackFocus},captain:state.clubs[clubId].captain,setPiecePlayer:state.clubs[clubId].setPiecePlayer,remember:!!career.getUint8(0xde),selectedPlayerId:renderer.selectedPlayerId});
