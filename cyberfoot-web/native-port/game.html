<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cyberfoot 2015</title>
<style>
 html,body{margin:0;width:100%;height:100%;background:#0c1716;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
 #screen{position:fixed;inset:0;background:#0c1716}
 #dev{position:fixed;right:8px;top:48px;z-index:20;display:none;background:rgba(0,0,0,.82);color:#9fe;border:1px solid #345;border-radius:4px;padding:6px;font:12px/1.5 monospace;max-width:320px}
 #dev[hidden]{display:none}
 #dev button{display:block;width:100%;margin:2px 0;background:#203040;color:#cfe;border:1px solid #456;padding:3px 6px;font:12px monospace;cursor:pointer;text-align:left}
 #dev button:disabled{opacity:.4;cursor:default}
 #registered-toggle{position:fixed;right:8px;top:8px;z-index:30;background:rgba(20,32,40,.94);color:#d8e7ee;border:1px solid #58717d;border-radius:4px;padding:5px 8px;font:12px/1.2 Arial,Helvetica,sans-serif;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.45)}
 #registered-toggle[data-enabled="true"]{background:rgba(31,100,65,.96);color:#fff;border-color:#80c99c}
 #registered-toggle:focus-visible{outline:2px solid #fff;outline-offset:2px}
 @media(max-width:600px){#registered-toggle{right:6px;top:6px;padding:4px 6px;font-size:11px}}
</style>
</head>
<body>
<div id="screen"></div>
<button type="button" id="registered-toggle" aria-pressed="false">Registered unlock: OFF</button>
<div id="dev" hidden>
 <div>Cyberfoot native VCL shell — dev overlay (F12)</div>
 <button type="button" id="dev-auction">Auction window (Form23)</button>
 <button type="button" id="dev-contract">Contract window (Form24)</button>
 <button type="button" id="dev-results">Results window (Form67)</button>
 <button type="button" id="dev-season">Season review (Form26)</button>
 <div id="dev-status"></div>
</div>
<script type="module" src="game-shell.mjs"></script>
</body>
</html>
