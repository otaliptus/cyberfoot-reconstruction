<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyberfoot 2015</title><style>html,body{margin:0;background:#101817;color:#dce7dc;font:14px 'Trebuchet MS',sans-serif;height:100%;overflow:auto}#display{min-height:100%;display:flex;align-items:center;justify-content:center}canvas{max-width:100%;max-height:100vh;width:auto;height:auto;display:block;outline:0;object-fit:contain}#loading{position:fixed;z-index:2;top:10px;left:50%;transform:translateX(-50%);background:#172b23ed;padding:13px 22px;border:1px solid #506c4c;border-radius:4px;text-align:center;max-width:90%;font-size:14px}#loading:has(#status:empty){display:none}#progress{width:220px;height:5px;accent-color:#d5fc67}#output,.compat{display:none}#spinner{width:8px;height:8px;background:#d5fc67;border-radius:100%;margin:0 auto 8px}</style></head><body>
<div id="loading"><div id="spinner"></div><div id="status">Preparing Cyberfoot…</div><progress id="progress" hidden></progress></div>
<div class="compat"><button id="startbtn"></button><span id="sound-checkbox"><input id="soundToggle" type="checkbox"></span><input id="pointerLock" type="checkbox"><input id="resize" type="checkbox"><input id="showConsole" type="checkbox"><button id="uploadbtn"></button><button id="downloadbtn"></button><input id="upload" type="file"><a id="modalLink"></a><a id="modalLinkExe"></a><div id="openModalExe"><a id="openModalExeClick"></a><div id="message"></div><div id="items"></div></div></div>
<div id="display"><div id="dropzone"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div></div><textarea id="output"></textarea><input id="restore" type="file" accept="application/json,.json" hidden>
<script>window.reportStatus=function(text){document.getElementById('status').textContent=text;parent.postMessage({type:'cyberfoot-status',text},location.origin)};window.reportFailure=function(text){reportStatus(text);parent.postMessage({type:'cyberfoot-error',text},location.origin)};</script>
<script src="package-loader.js"></script><script src="boxedwine-shell.js"></script><script src="bridge.js"></script><script async src="boxedwine.js"></script></body></html>
