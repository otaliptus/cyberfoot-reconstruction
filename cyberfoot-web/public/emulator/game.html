<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyberfoot 2015</title><style>html,body{margin:0;background:#101817;color:#dce7dc;font:14px 'Trebuchet MS',sans-serif;height:100%;overflow:auto}#display{min-height:100%;display:flex;align-items:center;justify-content:center}canvas{max-width:100%;max-height:100vh;width:auto;height:auto;display:block;outline:0;object-fit:contain}#loading{position:fixed;z-index:2;top:10px;left:50%;transform:translateX(-50%);background:#172b23ed;padding:13px 22px;border:1px solid #506c4c;border-radius:4px;text-align:center;max-width:90%;font-size:14px}#loading[hidden]{display:none}#loading{pointer-events:none}#loading strong{display:block;margin-bottom:5px}#status{font-size:12px;max-width:380px}#progress{width:220px;height:5px;accent-color:#d5fc67}#output,.compat{display:none}#spinner{display:block!important;width:22px;height:22px;border:3px solid #506c4c;border-top-color:#d5fc67;border-radius:50%;margin:0 auto 8px;animation:spin .8s linear infinite}#spinner[hidden]{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#spinner{animation:none}}</style></head><body>
<div id="loading" role="status" aria-live="polite" aria-atomic="true"><div id="spinner" aria-hidden="true"></div><strong id="loading-label">Please wait…</strong><div id="status">Preparing Cyberfoot…</div><progress id="progress" aria-label="Download progress" hidden></progress></div>
<div class="compat"><button id="startbtn"></button><span id="sound-checkbox"><input id="soundToggle" type="checkbox"></span><input id="pointerLock" type="checkbox"><input id="resize" type="checkbox"><input id="showConsole" type="checkbox"><button id="uploadbtn"></button><button id="downloadbtn"></button><input id="upload" type="file"><a id="modalLink"></a><a id="modalLinkExe"></a><div id="openModalExe"><a id="openModalExeClick"></a><div id="message"></div><div id="items"></div></div></div>
<div id="display"><div id="dropzone"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div></div><textarea id="output"></textarea><input id="restore" type="file" accept="application/json,.json" hidden>
<script src="loading.js"></script>
<script src="package-loader.js"></script><script src="boxedwine-shell.js"></script><script src="bridge.js"></script><script src="event-pump.js"></script><script src="fork-runtime.js"></script><script src="runtime-loader.js"></script></body></html>
